function showInfo(title,description){currentScreen='info';app.replaceChildren();window.scrollTo(0,0);const p=el('section','panel screen-enter');p.append(el('h2','',title),el('p','',description));const b=el('button','action','Открыть Telegram ↗');b.onclick=()=>{const link='https://t.me/progpt5_bot';if(tg?.openTelegramLink)tg.openTelegramLink(link);else location.assign(link)};p.append(b);app.append(p);renderNav()}

function show(c){currentScreen=c.id;app.replaceChildren();renderNav();window.scrollTo(0,0);if(tg?.BackButton){tg.BackButton.show();tg.BackButton.offClick(home);tg.BackButton.onClick(home)}const back=el('button','back','← Все направления');back.onclick=home;app.append(back);const p=el('section','panel screen-enter');p.append(makeCharacter(c.id),el('h2','',c.name),el('p','muted',c.sub),el('p','', 'Нейро-Ботик — '+c.role+': «'+c.tip+'»'));if(c.notice)p.append(el('p','muted',c.notice));const v=el('div','video');const item=media[c.id];if(item&&typeof item.url==='string'&&/^https:\/\//.test(item.url)){const video=el('video');video.controls=true;video.preload='none';video.playsInline=true;video.src=item.url;if(item.poster&&/^https:\/\//.test(item.poster))video.poster=item.poster;v.append(video);p.append(v)}else{const steps=el('div','steps');(c.route?['Выбери услугу и открой сценарий в боте','Загрузи материалы или опиши задачу','Получай результат в Telegram']:['Знакомься с возможностями направления','Запуск станет доступен после подключения сценария']).forEach((s,i)=>{const line=el('div','step');line.append(el('strong','',String(i+1).padStart(2,'0')),document.createTextNode(s));steps.append(line)});p.append(steps)}const btn=el('button','action',c.route?'Запустить в Telegram ↗':'Скоро появится');btn.disabled=!c.route||config.navigationEnabled!==true||!config.botUsername;btn.onclick=()=>{if(btn.disabled)return;const username=String(config.botUsername).replace(/^@/,'');if(!/^[A-Za-z0-9_]{5,32}$/.test(username))return;const payload='studio_'+c.route;const link='https://t.me/'+username+'?start='+encodeURIComponent(payload);if(tg?.openTelegramLink)tg.openTelegramLink(link);else window.location.assign(link)};p.append(btn);if(c.route)p.append(el('p','ready-note','Генерация выполняется в Telegram-боте; результаты приходят в чат.'));app.append(p)}
