<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2e"><title>Neyro Studio</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101a2e;color:#f5f8ff}*{box-sizing:border-box}body{margin:0;max-width:700px;margin-inline:auto;padding:20px 16px 95px;background:linear-gradient(#182c4c,#101a2e 300px)}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand{font-weight:800;font-size:19px}.muted{color:#b8c9e1;font-size:13px}.mascot{width:72px;height:72px;object-fit:contain;border-radius:20px;background:#263d62}.hero{padding:22px;background:#223d69;border:1px solid #46669a;border-radius:22px;margin-bottom:20px}h1{font-size:26px;margin:0 0 8px}h2{font-size:22px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:118px;background:#203451;color:inherit;border:1px solid #425978;border-radius:17px;text-align:left;padding:14px;cursor:pointer}.tile:focus-visible,button:focus-visible{outline:3px solid #88c9ff}.emoji{font-size:27px;display:block;margin-bottom:8px}.name{font-size:15px;font-weight:750}.detail{color:#b8c9e1;font-size:12px;margin-top:4px}.panel{padding:18px;background:#203451;border:1px solid #425978;border-radius:20px}.back{background:transparent;border:1px solid #61799b;border-radius:12px;padding:10px 14px;color:inherit;margin-bottom:20px}.video{background:#101e35;border:1px dashed #7185a2;border-radius:14px;padding:25px;text-align:center;margin:18px 0}.video video{width:100%;border-radius:10px}.action{display:block;width:100%;border:0;border-radius:14px;background:#3c7df1;color:white;padding:15px;font-weight:750}.action:disabled{background:#53647d;color:#c7d0dd}footer{position:fixed;bottom:0;left:0;right:0;background:#15243c;border-top:1px solid #425978;padding:12px;text-align:center;font-size:12px;color:#a9bad4}
</style></head><body>
<header><img class="mascot" id="mascot" alt="Нейро-Ботик" hidden><div><div class="brand">NEYRO-BOT GPT 5 STUDIO</div><div class="muted">Твоя AI-студия и умный помощник</div></div></header>
<main id="app"></main><footer>Каталог возможностей · Медиа-примеры подключаются после проверки</footer>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
const catalog=[
{id:'medicine',icon:'🩺',name:'AI-Медицина',sub:'Медкарта, анализы, МРТ и КТ',role:'Врач',tip:'Помогу разобраться в результатах исследований и подготовить вопросы врачу.',notice:'AI не заменяет врача. Медицинские документы не передаются через навигацию.'},
{id:'video',icon:'🎬',name:'AI-Видео',sub:'Клипы, ролики, анимация',role:'Режиссёр',tip:'Выбери формат ролика и посмотри примеры генерации.'},
{id:'market',icon:'🛍️',name:'Маркетплейсы',sub:'Карточки и инфографика',role:'Дизайнер',tip:'Создадим выразительную карточку товара.',route:'market'},
{id:'celebrity',icon:'⭐',name:'Селфи со звездой',sub:'Совместные AI-фото',role:'Фотограф',tip:'Подготовим постановочное AI-селфи со знаменитостью.'},
{id:'realty',icon:'🏡',name:'Недвижимость',sub:'Видеообзоры объектов',role:'Оператор',tip:'Соберём обзор помещений в нужном порядке.',route:'realty'},
{id:'photo',icon:'🎨',name:'AI-Фотостудия',sub:'Генерация и ретушь',role:'Художник',tip:'Расскажи, какое изображение нужно.',},
{id:'music',icon:'🎵',name:'Музыка',sub:'Песни и вокал',role:'Продюсер',tip:'Начнём с идеи песни и стиля.'},
{id:'study',icon:'🎓',name:'Учёба',sub:'Задачи и обучение',role:'Преподаватель',tip:'Разберём сложную тему по шагам.',},
{id:'work',icon:'💼',name:'Работа',sub:'Тексты и аналитика',role:'Консультант',tip:'Помогу с документами и задачами.',},
{id:'assistant',icon:'🧠',name:'AI-Ассистент',sub:'Вопросы и поиск',role:'Помощник',tip:'Задай свой вопрос.'},
{id:'advert',icon:'📣',name:'Реклама товара',sub:'Сценарии и проморолики',role:'Маркетолог',tip:'Загрузи референсы и опиши товар.',route:'advert'}
];
const app=document.getElementById('app');const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}
const config=window.NEYRO_STUDIO_CONFIG||{};const launchedFromKeyboard=Boolean(tg?.initDataUnsafe?.query_id===undefined && tg?.sendData);const media=config.media||{};const mascot=document.getElementById('mascot');
if(typeof config.mascotUrl==='string' && /^https:\/\//.test(config.mascotUrl)){mascot.src=config.mascotUrl;mascot.hidden=false}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function home(){app.replaceChildren();const hero=el('section','hero');hero.append(el('h1','', 'Твори. Исследуй. Решай.'),el('p','', 'Открой возможности Neyro-Bot — от медицины до AI-видео.'));app.append(hero);const grid=el('section','grid');catalog.forEach(c=>{const b=el('button','tile');b.type='button';b.append(el('span','emoji',c.icon),el('div','name',c.name),el('div','detail',c.sub));b.addEventListener('click',()=>show(c));grid.append(b)});app.append(grid)}
function show(c){app.replaceChildren();const back=el('button','back','← Все направления');back.onclick=home;app.append(back);const p=el('section','panel');p.append(el('h2','',c.icon+' '+c.name),el('p','muted',c.sub),el('p','', 'Нейро-Ботик — '+c.role+': «'+c.tip+'»'));if(c.notice)p.append(el('p','muted',c.notice));const v=el('div','video');const item=media[c.id];if(item&&typeof item.url==='string'&&/^https:\/\//.test(item.url)){const video=el('video');video.controls=true;video.preload='none';video.playsInline=true;video.src=item.url;if(item.poster&&/^https:\/\//.test(item.poster))video.poster=item.poster;v.append(video)}else v.textContent='🎞️ Проверенный видеопример будет добавлен';p.append(v);const btn=el('button','action',c.route?'Открыть в Telegram':'Запуск после подключения');btn.disabled=!c.route||typeof tg?.sendData!=='function'||config.navigationEnabled!==true||config.launchMode!=='keyboard';btn.onclick=()=>{if(btn.disabled)return;tg.sendData(JSON.stringify({v:1,action:'open_mode',route:c.route}))};p.append(btn);if(!config.navigationEnabled||config.launchMode!=='keyboard')p.append(el('p','muted','Переход из Mini App доступен только после подтверждения серверной интеграции и запуска через клавиатурную Web App кнопку.'));app.append(p)}
home();
</script></body></html>
