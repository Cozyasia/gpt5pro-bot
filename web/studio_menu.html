<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2e"><title>Neyro Studio — AI платформа</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101a2e;color:#f5f8ff}*{box-sizing:border-box}body{margin:0;max-width:700px;margin-inline:auto;padding:20px 16px 95px;background:linear-gradient(#182c4c,#101a2e 300px)}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand{font-weight:800;font-size:19px}.muted{color:#b8c9e1;font-size:13px}.mascot{width:72px;height:72px;object-fit:contain;border-radius:20px;background:#263d62}.hero{padding:22px;background:#223d69;border:1px solid #46669a;border-radius:22px;margin-bottom:20px}h1{font-size:26px;margin:0 0 8px}h2{font-size:22px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:118px;background:#203451;color:inherit;border:1px solid #425978;border-radius:17px;text-align:left;padding:14px;cursor:pointer}.tile:focus-visible,button:focus-visible{outline:3px solid #88c9ff}.emoji{font-size:27px;display:block;margin-bottom:8px}.name{font-size:15px;font-weight:750}.detail{color:#b8c9e1;font-size:12px;margin-top:4px}.panel{padding:18px;background:#203451;border:1px solid #425978;border-radius:20px}.back{background:transparent;border:1px solid #61799b;border-radius:12px;padding:10px 14px;color:inherit;margin-bottom:20px}.video{background:#101e35;border:1px dashed #7185a2;border-radius:14px;padding:25px;text-align:center;margin:18px 0}.video video{width:100%;border-radius:10px}.action{display:block;width:100%;border:0;border-radius:14px;background:#3c7df1;color:white;padding:15px;font-weight:750}.action:disabled{background:#53647d;color:#c7d0dd}footer{position:fixed;bottom:0;left:0;right:0;background:#15243c;border-top:1px solid #425978;padding:12px;text-align:center;font-size:12px;color:#a9bad4}

:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#070e20}
body{max-width:760px;padding:18px 17px 100px;background:radial-gradient(ellipse 95% 430px at 50% -80px,#284b92 0%,#111d3b 58%,transparent 100%),#090f21;min-height:100vh}
header{margin-bottom:22px;gap:15px}.brand{font-size:17px;letter-spacing:.045em}.muted{color:#b8c8e7}
.mascot{border-radius:23px;background:linear-gradient(145deg,#3463b8,#172f68);box-shadow:0 12px 35px #071229, inset 0 1px #8abaff60}
.hero{position:relative;overflow:hidden;min-height:310px;padding:27px 24px;border-radius:28px;background:radial-gradient(circle at 83% 20%,#3a7de7aa,transparent 48%),linear-gradient(145deg,#254985,#152950 70%);border:1px solid #6392dc80;box-shadow:0 18px 50px #03091880;margin-bottom:26px}
.hero:before{content:'';position:absolute;width:250px;height:250px;border-radius:50%;right:-80px;top:-95px;border:1px solid #9fcaff50;box-shadow:0 0 0 25px #9fcaff0b,0 0 0 60px #9fcaff08}
.hero h1{font-size:clamp(30px,7vw,44px);line-height:1.07;letter-spacing:-.045em;max-width:380px;position:relative;z-index:1}
.hero p{font-size:15px;line-height:1.6;max-width:280px;position:relative;z-index:1;color:#e0ebff}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:#8bc5ff1a;border:1px solid #9bcaff55;border-radius:30px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.12em;margin-bottom:19px;color:#c7e7ff}
.hero-art{position:absolute;right:-10px;bottom:-14px;width:47%;max-width:220px;filter:drop-shadow(0 12px 16px #06163399);animation:floatbot 5s ease-in-out infinite}
@keyframes floatbot{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.section-title{font-size:19px;font-weight:800;margin:23px 0 13px;letter-spacing:-.02em}
.grid{gap:12px}.tile{position:relative;overflow:hidden;min-height:150px;border-radius:21px;padding:18px 15px;background:linear-gradient(155deg,#21385d,#172844);border:1px solid #5475a380;box-shadow:inset 0 1px #ffffff12,0 9px 25px #040b1b45;transition:transform .18s,border-color .18s,background .18s}
.tile:active{transform:scale(.96)}.tile:hover{border-color:#9ec6ff;background:linear-gradient(145deg,#2b4d7e,#1b3053)}
.tile:before{content:'';position:absolute;right:-25px;top:-40px;width:110px;height:110px;border-radius:50%;background:var(--accent,#569bff);opacity:.13;filter:blur(13px)}
.emoji{font-size:33px;margin-bottom:15px;filter:drop-shadow(0 4px 9px #0005)}.name{font-size:16px}.detail{font-size:12px;line-height:1.45;margin-top:7px}
.tile-arrow{position:absolute;right:14px;bottom:13px;color:#9cc7fa;font-size:18px}
.panel{border-radius:25px;background:linear-gradient(155deg,#243f70,#152844);padding:23px;border-color:#5a80b4}
.video{background:#101c34;border-color:#607fa6}footer{backdrop-filter:blur(18px);background:#0c1734dc;border-color:#4b6b9a80}
@media(prefers-reduced-motion:reduce){.hero-art{animation:none}.tile{transition:none}}
.filterbar{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}.filterbar::-webkit-scrollbar{display:none}.chip{flex:none;padding:10px 14px;border:1px solid #55729d;border-radius:22px;color:#d9eaff;background:#172d4d;font-weight:700;font-size:12px}.chip.active{background:#d8eaff;color:#122a51;border-color:#d8eaff}.tile-status{display:inline-block;margin-top:10px;font-size:10px;color:#a8d7ff;font-weight:750}.tile-status.soon{color:#a8b4cc}.steps{display:grid;gap:9px;margin:18px 0}.step{padding:12px 14px;border:1px solid #ffffff20;background:#091b364d;border-radius:13px;font-size:13px;line-height:1.5}.step strong{color:#a5d8ff;margin-right:9px}.role-icon{width:70px;height:70px;display:grid;place-items:center;font-size:35px;border-radius:20px;background:linear-gradient(140deg,#3667a3,#1b3566);margin-bottom:18px}.ready-note{font-size:12px;color:#a9c8f2;margin:10px 0}.back{cursor:pointer}.action:not(:disabled){cursor:pointer;box-shadow:0 8px 25px #2059b05c}

/* Studio character system and animated section presentation */
.character-stage{position:relative;display:grid;place-items:center;height:185px;margin:-5px -5px 18px;border-radius:23px;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,#4e8ce44a,transparent 65%),linear-gradient(145deg,#213e6c,#101f3c);border:1px solid #769ed64a}
.character-stage:before{content:'';position:absolute;width:190px;height:190px;border:1px solid #a8d9ff30;border-radius:50%;box-shadow:0 0 0 22px #c6e8ff09,0 0 0 48px #c6e8ff05;animation:orb 8s linear infinite}
.character-stage svg{position:relative;height:175px;width:165px;filter:drop-shadow(0 12px 18px #020b2180);animation:floatbot 5s ease-in-out infinite}
.character-stage .role-badge{position:absolute;right:13px;bottom:12px;background:#d7eaff;color:#163260;padding:7px 11px;border-radius:25px;font-weight:800;font-size:11px}
@keyframes orb{to{transform:rotate(360deg)}}.screen-enter{animation:screenIn .3s ease-out both}@keyframes screenIn{from{opacity:.2;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.tile .mini-character{position:absolute;right:-12px;top:-20px;width:95px;height:115px;opacity:.28;transform:rotate(-13deg);pointer-events:none;filter:drop-shadow(0 0 14px #65adff88)}
.tile .mini-character svg{width:100%;height:100%}.tile .emoji,.tile .name,.tile .detail,.tile .tile-status{position:relative;z-index:1}
.tile[data-ready="true"]{border-color:#5a96d4a8}.tile-status{letter-spacing:.04em}
@media(prefers-reduced-motion:reduce){.character-stage:before,.character-stage svg,.screen-enter{animation:none}}
</style></head><body>

fill="#2d77db"/><path d="M114 212h10m-5-5v10" stroke="#e6f9ff" stroke-width="3" stroke-linecap="round"/></svg></span><img class="mascot" id="mascot" alt="Нейро-Ботик" hidden><div><div class="brand">NEYRO-BOT GPT 5 STUDIO</div><div class="muted">Твоя AI-студия и умный помощник</div></div></header>
<main id="app"></main><footer>Каталог возможностей · Медиа-примеры подключаются после проверки</footer>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
const catalog=[
{id:'medicine',icon:'🩺',name:'AI-Медицина',sub:'Медкарта, анализы, МРТ и КТ',role:'Врач',tip:'Помогу разобраться в результатах исследований и подготовить вопросы врачу.',notice:'AI не заменяет врача. Медицинские документы не передаются через навигацию.'},
{id:'video',icon:'🎬',name:'AI-Видео',sub:'Клипы, ролики, анимация',role:'Режиссёр',tip:'Выбери формат ролика и посмотри примеры генерации.'},
{id:'market',icon:'🛍️',name:'Маркетплейсы',sub:'Карточки и инфографика',role:'Дизайнер',tip:'Создадим выразительную карточку товара.',route:'market'},
{id:'celebrity',icon:'⭐',name:'Селфи со звездой',sub:'Совместные AI-фото',role:'Фотограф',tip:'Подготовим постановочное AI-селфи со знаменитостью.'},
{id:'realty',icon:'🏡',name:'Недвижимость',sub:'Видеообзоры объектов',role:'Оператор',tip:'Соберём обзор помещений в нужном порядке.',route:'realty'},
{id:'photo',icon:'🎨',name:'AI-Фотостудия',sub:'Генерация и ретушь',role:'Художник',tip:'Расскажи, какое изображение нужно.',},
{id:'music',icon:'🎵',name:'Музыка',sub:'Песни и вокал',role:'Продюсер',tip:'Начнём с идеи песни и стиля.'},
{id:'study',icon:'🎓',name:'Учёба',sub:'Задачи и обучение',role:'Преподаватель',tip:'Разберём сложную тему по шагам.',},
{id:'work',icon:'💼',name:'Работа',sub:'Тексты и аналитика',role:'Консультант',tip:'Помогу с документами и задачами.',},
{id:'assistant',icon:'🧠',name:'AI-Ассистент',sub:'Вопросы и поиск',role:'Помощник',tip:'Задай свой вопрос.'},
{id:'advert',icon:'📣',name:'Реклама товара',sub:'Сценарии и проморолики',role:'Маркетолог',tip:'Загрузи референсы и опиши товар.',route:'advert'}
];
const qp=new URLSearchParams(location.search);if(qp.get('bot')==='gpt5pro_bot'){qp.set('bot','progpt5_bot');history.replaceState(null,'',location.pathname+'?'+qp.toString())}
const groups=[{id:'all',name:'Все'},{id:'creative',name:'Творчество'},{id:'business',name:'Бизнес'},{id:'help',name:'Помощь'}];const category={medicine:'help',video:'creative',market:'business',celebrity:'creative',realty:'business',photo:'creative',music:'creative',study:'help',work:'business',assistant:'help',advert:'business'};let activeGroup='all';
const app=document.getElementById('app');const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}
const config=Object.assign({navigationEnabled:true,botUsername:'progpt5_bot'},window.NEYRO_STUDIO_CONFIG||{});const media=config.media||{};const mascot=document.getElementById('mascot');
if(typeof config.mascotUrl==='string' && /^https:\/\//.test(config.mascotUrl)){mascot.src=config.mascotUrl;mascot.hidden=false;document.getElementById('mascotFallback').hidden=true}
const robotMarkup=document.getElementById('mascotFallback').innerHTML;
const roleDecor={medicine:'✚',video:'▶',market:'◆',celebrity:'★',realty:'⌂',photo:'✦',music:'♫',study:'✎',work:'▣',assistant:'✧',advert:'◈'};
function makeCharacter(id,small=false){const stage=el('div',small?'mini-character':'character-stage');const svg=el('div','');svg.innerHTML=robotMarkup;const art=svg.firstElementChild;if(art){art.setAttribute('aria-label','Нейро-Ботик — '+(catalog.find(x=>x.id===id)?.role||'ассистент'));stage.append(art)}if(!small)stage.append(el('span','role-badge',(roleDecor[id]||'✦')+' '+(catalog.find(x=>x.id===id)?.role||'AI')));return stage}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function home(){app.replaceChildren();if(tg?.BackButton){tg.BackButton.hide()}const hero=el('section','hero');hero.append(el('div','eyebrow','✦ ТВОЯ НЕЙРОСТУДИЯ'),el('h1','', 'Идеи становятся реальностью.'),el('p','', 'Создавай видео, карточки товаров, музыку и изображения. Всё в одной AI-студии.'));const art=el('div','hero-art');art.innerHTML=document.getElementById('mascotFallback').innerHTML;hero.append(art);app.append(hero);app.append(el('h2','section-title','Выбери направление'));const bar=el('nav','filterbar');bar.setAttribute('aria-label','Категории услуг');groups.forEach(g=>{const chip=el('button','chip'+(g.id===activeGroup?' active':''),g.name);chip.type='button';chip.setAttribute('aria-pressed',String(g.id===activeGroup));chip.onclick=()=>{activeGroup=g.id;home()};bar.append(chip)});app.append(bar);const grid=el('section','grid screen-enter');catalog.filter(c=>activeGroup==='all'||category[c.id]===activeGroup).forEach((c,i)=>{const b=el('button','tile');b.style.setProperty('--accent',['#6dbbff','#b18aff','#ffbb70','#ff86ad','#62e5c1'][i%5]);b.type='button';b.dataset.ready=String(!!c.route);b.append(makeCharacter(c.id,true),el('span','emoji',c.icon),el('div','name',c.name),el('div','detail',c.sub),el('div','tile-status'+(c.route?'':' soon'),c.route?'● ДОСТУПНО':'СКОРО'),el('span','tile-arrow','↗'));b.addEventListener('click',()=>show(c));grid.append(b)});app.append(grid)}
function show(c){app.replaceChildren();if(tg?.BackButton){tg.BackButton.show();tg.BackButton.offClick(home);tg.BackButton.onClick(home)}const back=el('button','back','← Все направления');back.onclick=home;app.append(back);const p=el('section','panel screen-enter');p.append(makeCharacter(c.id),el('h2','',c.name),el('p','muted',c.sub),el('p','', 'Нейро-Ботик — '+c.role+': «'+c.tip+'»'));if(c.notice)p.append(el('p','muted',c.notice));const v=el('div','video');const item=media[c.id];if(item&&typeof item.url==='string'&&/^https:\/\//.test(item.url)){const video=el('video');video.controls=true;video.preload='none';video.playsInline=true;video.src=item.url;if(item.poster&&/^https:\/\//.test(item.poster))video.poster=item.poster;v.append(video);p.append(v)}else{const steps=el('div','steps');(c.route?['Выбери услугу и открой сценарий в боте','Загрузи материалы или опиши задачу','Получай результат в Telegram']:['Знакомься с возможностями направления','Запуск станет доступен после подключения сценария']).forEach((s,i)=>{const line=el('div','step');line.append(el('strong','',String(i+1).padStart(2,'0')),document.createTextNode(s));steps.append(line)});p.append(steps)}const btn=el('button','action',c.route?'Запустить в Telegram ↗':'Скоро появится');btn.disabled=!c.route||config.navigationEnabled!==true||!config.botUsername;btn.onclick=()=>{if(btn.disabled)return;const username=String(config.botUsername).replace(/^@/,'');if(!/^[A-Za-z0-9_]{5,32}$/.test(username))return;const payload='studio_'+c.route;const link='https://t.me/'+username+'?start='+encodeURIComponent(payload);if(tg?.openTelegramLink)tg.openTelegramLink(link);else window.location.assign(link)};p.append(btn);if(c.route)p.append(el('p','ready-note','Генерация выполняется в Telegram-боте; результаты приходят в чат.'));app.append(p)}
home();
</script></body></html>
