name: Veo integration checks
on:
  push:
    branches:
      - feature/veo31-fast-native-audio
  pull_request:
    branches:
      - main
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py
      - run: python -m unittest discover -s tests -p 'test_veo_fast_routing.py' -v
