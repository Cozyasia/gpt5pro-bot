name: NEYRONIX billing regression

on:
  push:
    branches:
      - work/neyronix-migration-20261028
    paths:
      - 'neyronix_pricing.py'
      - 'neyronix_quotes.py'
      - 'neyronix_entitlements.py'
      - 'tests/test_neyronix_quotes.py'
      - 'tests/test_neyronix_pricing_regression.py'
      - '.github/workflows/neyronix-billing-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pricing-and-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Verify pricing and quote lifecycle
        run: python -m unittest discover -s tests -p 'test_neyronix_*quotes.py' -v
      - name: Verify pricing regression and legacy units
        run: python -m unittest discover -s tests -p 'test_neyronix_pricing_regression.py' -v
