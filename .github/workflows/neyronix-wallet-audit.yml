name: NEYRONIX wallet audit safety
on:
  push:
    branches: [work/neyronix-migration-20261028]
    paths:
      - 'scripts/audit_wallet_migration.py'
      - 'tests/test_neyronix_wallet_audit.py'
      - '.github/workflows/neyronix-wallet-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_neyronix_wallet_audit.py' -v
