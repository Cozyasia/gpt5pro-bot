name: V262 Production Size Check Once

on:
  push:
    branches: ["work/v262-quality-stability-20260831"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prodsize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v262-quality-stability-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download public portrait fixtures
        run: |
          mkdir -p /tmp/v262-fixtures /tmp/v262-check
          base="https://raw.githubusercontent.com/yakhyo/uniface/df87c6531f4d1bdad665882d42d658590e724ea4/assets/source"
          curl -L --fail --retry 3 "$base/verify_now_2024.jpg" -o /tmp/v262-fixtures/source.jpg
          curl -L --fail --retry 3 "$base/verify_curie.jpg" -o /tmp/v262-fixtures/right.jpg
      - name: Run 1856x2304 V262 large-face path
        env:
          PROD_HARDENING_ENABLED: "0"
        run: |
          python - <<'PY' | tee /tmp/v262-check/report.log
          import json, resource
          from pathlib import Path
          import cv2
          import numpy as np
          from neyrobot_prod import selfie_v253_yunet_source_pixels as v253
          from neyrobot_prod import selfie_v254_landmark_fit_seamless_source as v254
          from neyrobot_prod import selfie_v262_landmark_field_compositor as v262

          W, H = 1856, 2304
          source = cv2.imread('/tmp/v262-fixtures/source.jpg', cv2.IMREAD_COLOR)
          right = cv2.imread('/tmp/v262-fixtures/right.jpg', cv2.IMREAD_COLOR)
          assert source is not None and right is not None

          # Real-size target canvas; PERSON-B occupies the protected right side.
          target = np.full((H, W, 3), 118, dtype=np.uint8)
          firewall_x = int(round(W * 0.55))
          left_fit = cv2.resize(source, (firewall_x, H), interpolation=cv2.INTER_AREA)
          target[:, :firewall_x] = left_fit
          rw = W - firewall_x
          right_fit = cv2.resize(right, (rw, H), interpolation=cv2.INTER_AREA)
          target[:, firewall_x:] = right_fit

          source_bbox = np.asarray([620, 360, 516, 710], dtype=np.float32)
          target_bbox = np.asarray([111, 738, 736, 994], dtype=np.float32)
          source_pts = np.asarray([
              [760, 590], [1000, 590], [880, 760], [790, 900], [970, 900]
          ], dtype=np.float32)
          base_matrix = np.asarray([[1.40, 0.0, -900.0], [0.0, 1.40, 10.0]], dtype=np.float32)
          base_target = v262._project_points(base_matrix, source_pts)

          # Find a non-affine five-point perturbation matching the production class:
          # >28px old fixed guard, but inside the new scale-normalized large-face guard.
          chosen_target = None
          chosen_max = None
          chosen_limit = v262._landmark_residual_limit(float(target_bbox[2]))
          for shift in np.linspace(42.0, 78.0, 73):
              candidate = base_target.copy()
              candidate[3, 0] += float(shift)
              candidate[1, 1] -= float(shift * 0.22)
              matrix, mode, sim_err, fit_err, anisotropy = v254._choose_transform(source_pts, candidate)
              projected = v262._project_points(matrix, source_pts)
              max_res = float(np.linalg.norm(candidate - projected, axis=1).max())
              if 30.0 <= max_res < chosen_limit - 0.25:
                  chosen_target = candidate.astype(np.float32)
                  chosen_max = max_res
                  break
          if chosen_target is None:
              raise RuntimeError(f'could not synthesize bounded residual; limit={chosen_limit:.2f}')

          original_yunet = v253._yunet_face
          def fake_yunet(frame, model_path, *, label):
              if 'source' in str(label):
                  return source_bbox.copy(), source_pts.copy()
              return target_bbox.copy(), chosen_target.copy()
          v253._yunet_face = fake_yunet

          ok_s, src_png = cv2.imencode('.png', source, [cv2.IMWRITE_PNG_COMPRESSION, 2])
          ok_t, tgt_png = cv2.imencode('.png', target, [cv2.IMWRITE_PNG_COMPRESSION, 2])
          assert ok_s and ok_t
          before_kb = int(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)
          try:
              output = v262._source_pixel_transfer_v262(bytes(tgt_png), bytes(src_png), Path('/tmp/fake-yunet.onnx'))
          finally:
              v253._yunet_face = original_yunet
          after_kb = int(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)
          final = v253._decode_bgr(output)
          person_b_untouched = bool(np.array_equal(final[:, firewall_x:], target[:, firewall_x:]))
          png = output.startswith(b'\x89PNG\r\n\x1a\n')
          report = {
              'width': W, 'height': H,
              'synthetic_max_residual': round(float(chosen_max), 4),
              'residual_limit': round(float(chosen_limit), 4),
              'old_fixed_guard_exceeded': bool(chosen_max > 28.0),
              'person_b_untouched': person_b_untouched,
              'output_png': png,
              'output_bytes': len(output),
              'peak_rss_bytes': after_kb * 1024,
              'peak_delta_bytes': max(0, after_kb - before_kb) * 1024,
          }
          print('V262_PRODUCTION_SIZE_RESULT', json.dumps(report, sort_keys=True), flush=True)
          Path('/tmp/v262-check/output.png').write_bytes(output)
          if not person_b_untouched or not png:
              raise SystemExit('V262 production-size invariants failed')
          # Keep a meaningful margin below Render's ~512MiB service limit.
          if after_kb * 1024 >= 500 * 1024 * 1024:
              raise SystemExit(f'V262 peak RSS too high: {after_kb * 1024}')
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v262-production-size-check
          path: |
            /tmp/v262-check/report.log
            /tmp/v262-check/output.png
          retention-days: 2
