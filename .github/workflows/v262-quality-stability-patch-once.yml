name: V262 Quality Stability Patch Once

on:
  push:
    branches: ["work/v262-quality-stability-20260831"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v262-quality-stability-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded V262 quality and stability changes
        run: |
          python - <<'PY'
          from pathlib import Path

          # --- V262: scale-normalized residual guard + ROI-only LAB colour matching ---
          p = Path("neyrobot_prod/selfie_v262_landmark_field_compositor.py")
          s = p.read_text(encoding="utf-8")

          old = "_MAX_LANDMARK_RESIDUAL = 28.0\n_FIELD_SIGMA_X_FRACTION = 0.075"
          new = "_MAX_LANDMARK_RESIDUAL = 28.0\n_MAX_LANDMARK_RESIDUAL_FRACTION = 0.060\n_MAX_LANDMARK_RESIDUAL_CAP = 48.0\n_FIELD_SIGMA_X_FRACTION = 0.075"
          assert old in s
          s = s.replace(old, new, 1)

          marker = "\ndef _landmark_anatomy_mask(shape, bbox, landmarks, firewall_x: int):\n"
          helper = '''\ndef _landmark_residual_limit(face_min: float) -> float:\n    \"\"\"Scale the all-five correction budget with PERSON-A face size, with hard bounds.\n\n    V262 historically used a fixed 28px ceiling.  On a production 736px face that\n    turned a geometrically moderate 40.54px residual (5.51% of face short side) into\n    an unnecessary V258 fallback.  Keep 28px for small/normal faces, permit up to 6%\n    on large faces, and retain a hard 48px ceiling so pathological fits still fail.\n    \"\"\"\n    face = max(1.0, float(face_min))\n    return min(\n        _MAX_LANDMARK_RESIDUAL_CAP,\n        max(_MAX_LANDMARK_RESIDUAL, face * _MAX_LANDMARK_RESIDUAL_FRACTION),\n    )\n\n\ndef _colour_match_lab_roi(warped, target, mask, box):\n    \"\"\"V253-equivalent LAB statistics, but only inside the compact PERSON-A ROI.\n\n    This intentionally preserves V253 colour math while avoiding three full-frame\n    float32 LAB buffers at 1856x2304.  Outside the ROI the warped uint8 frame is\n    unchanged; PERSON-B is restored by the existing firewall later.\n    \"\"\"\n    import cv2\n    import numpy as np\n\n    x0, y0, x1, y1 = [int(v) for v in box]\n    src_roi = warped[y0:y1, x0:x1]\n    tgt_roi = target[y0:y1, x0:x1]\n    mask_roi = mask[y0:y1, x0:x1]\n    region = mask_roi > 80\n    if int(region.sum()) < 500:\n        return warped.copy()\n\n    src_lab = cv2.cvtColor(src_roi, cv2.COLOR_BGR2LAB).astype(np.float32)\n    tgt_lab = cv2.cvtColor(tgt_roi, cv2.COLOR_BGR2LAB).astype(np.float32)\n    out_lab = src_lab.copy()\n    for channel in range(3):\n        src_values = src_lab[:, :, channel][region]\n        tgt_values = tgt_lab[:, :, channel][region]\n        src_mean, tgt_mean = float(src_values.mean()), float(tgt_values.mean())\n        src_std, tgt_std = float(src_values.std()), float(tgt_values.std())\n        gain = 1.0 if src_std < 1.0 else max(0.78, min(1.22, tgt_std / src_std))\n        adjusted = (src_lab[:, :, channel] - src_mean) * gain + tgt_mean\n        out_lab[:, :, channel] = np.clip(adjusted, 0.0, 255.0)\n\n    matched_roi = cv2.cvtColor(out_lab.astype(np.uint8), cv2.COLOR_LAB2BGR)\n    matched = warped.copy()\n    matched[y0:y1, x0:x1] = matched_roi\n    return matched\n\n'''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)

          old = '''    residual_norms = np.linalg.norm(residuals, axis=1)\n    max_residual = float(residual_norms.max())\n    if max_residual > _MAX_LANDMARK_RESIDUAL:\n        raise RuntimeError(f\"V262 landmark residual too large: max={max_residual:.2f}px\")\n'''
          new = '''    residual_norms = np.linalg.norm(residuals, axis=1)\n    max_residual = float(residual_norms.max())\n    residual_limit = _landmark_residual_limit(face_min)\n    if max_residual > residual_limit:\n        raise RuntimeError(\n            f\"V262 landmark residual too large: max={max_residual:.2f}px \"\n            f\"limit={residual_limit:.2f}px normalized={max_residual / max(1.0, face_min):.4f}\"\n        )\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = "    matched = v253._colour_match_lab(corrected, target, anatomy_mask)\n"
          new = "    matched = _colour_match_lab_roi(corrected, target, anatomy_mask, box)\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        \"native_face_short=%.1f landmark_residuals=%s landmark_shifts=%s max_residual=%.2f \"\n        \"landmark_field=all5 field_sigma=%.1f,%.1f independent_eye_patch=false \"'''
          new = '''        \"native_face_short=%.1f landmark_residuals=%s landmark_shifts=%s max_residual=%.2f residual_limit=%.2f \"\n        \"landmark_field=all5 field_sigma=%.1f,%.1f colour_match=lab_roi independent_eye_patch=false \"'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        residual_text, shift_text, max_residual, field_sigma_x, field_sigma_y,\n        mask_pixels, x1 - x0, y1 - y0, blend_mode,'''
          new = '''        residual_text, shift_text, max_residual, residual_limit, field_sigma_x, field_sigma_y,\n        mask_pixels, x1 - x0, y1 - y0, blend_mode,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        \"mask=landmark_anatomical_hull ellipse_final_mask=false blend=poisson_plus_source_high_frequency \"\n        \"raw_low_frequency_reinject=false solid_source_core=false full_frame_float_blend=false \"'''
          new = '''        \"mask=landmark_anatomical_hull ellipse_final_mask=false blend=poisson_plus_source_high_frequency \"\n        \"colour_match=lab_roi residual_guard=scale_normalized_28_48px raw_low_frequency_reinject=false \"\n        \"solid_source_core=false full_frame_float_blend=false \"'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    \"_landmark_anatomy_mask\",\n    \"_deform_all_landmarks_roi\",\n]'''
          new = '''    \"_landmark_anatomy_mask\",\n    \"_deform_all_landmarks_roi\",\n    \"_landmark_residual_limit\",\n    \"_colour_match_lab_roi\",\n]'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # --- Gemini failover: preserve Pro-first quality, remove the 2x120s stall ---
          p = Path("neyrobot_prod/selfie_v241_authoritative_runtime.py")
          s = p.read_text(encoding="utf-8")
          old = 'timeout_s = max(75.0, min(150.0, float(os.environ.get("GEMINI_SELFIE_REQUEST_TIMEOUT_S", "120") or 120)))'
          new = 'timeout_s = max(60.0, min(120.0, float(os.environ.get("GEMINI_SELFIE_REQUEST_TIMEOUT_S", "90") or 90)))'
          assert old in s
          s = s.replace(old, new, 1)
          old = "            max_attempts = 2 if is_pro else 1\n"
          new = "            # One bounded Pro attempt preserves preferred quality without a second long stall.\n            # A transient failure opens the existing circuit and immediately routes to Flash.\n            max_attempts = 1\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = '    _log("AI_SELFIE_V241_STAGE_START stage=%s models=%s refs=%s timeout=%.0fs", stage, ",".join(models), len(labeled_images), timeout_s)\n'
          new = '    _log("AI_SELFIE_V241_STAGE_START stage=%s models=%s refs=%s timeout=%.0fs pro_attempts=1 circuit_seconds=300", stage, ",".join(models), len(labeled_images), timeout_s)\n'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # --- Logging: never emit request URLs that can contain Telegram bot credentials ---
          p = Path("main.py")
          s = p.read_text(encoding="utf-8")
          old = 'log = logging.getLogger("gpt-bot")\n\nPATCH_VERSION'
          new = '''log = logging.getLogger("gpt-bot")\n# httpx INFO request logs include full Telegram Bot API URLs, which contain the bot\n# credential in the path.  Application-owned provider/delivery logs already record\n# status and timing without secrets, so keep transport libraries at WARNING.\nlogging.getLogger("httpx").setLevel(logging.WARNING)\nlogging.getLogger("httpcore").setLevel(logging.WARNING)\n\nPATCH_VERSION'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # --- Regression tests ---
          p = Path("tests/test_v262_landmark_field_compositor.py")
          s = p.read_text(encoding="utf-8")
          old = '        self.assertIn("_MAX_LANDMARK_RESIDUAL = 28.0", source)\n'
          new = '''        self.assertIn("_MAX_LANDMARK_RESIDUAL = 28.0", source)\n        self.assertIn("_MAX_LANDMARK_RESIDUAL_FRACTION = 0.060", source)\n        self.assertIn("_MAX_LANDMARK_RESIDUAL_CAP = 48.0", source)\n        self.assertIn("_landmark_residual_limit(face_min)", source)\n        self.assertIn("colour_match=lab_roi", source)\n        self.assertNotIn("v253._colour_match_lab(corrected, target, anatomy_mask)", source)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          Path("tests/test_v262_quality_stability.py").write_text('''# -*- coding: utf-8 -*-\nfrom __future__ import annotations\n\nimport logging\nimport unittest\nfrom pathlib import Path\n\nfrom neyrobot_prod import selfie_v262_landmark_field_compositor as v262\n\n\nclass V262QualityStabilityTests(unittest.TestCase):\n    def test_large_face_residual_guard_is_scale_normalized_but_capped(self) -> None:\n        self.assertAlmostEqual(v262._landmark_residual_limit(200.0), 28.0, places=6)\n        self.assertAlmostEqual(v262._landmark_residual_limit(736.0), 44.16, places=6)\n        self.assertGreater(v262._landmark_residual_limit(736.0), 40.54)\n        self.assertAlmostEqual(v262._landmark_residual_limit(1200.0), 48.0, places=6)\n\n    def test_v262_colour_match_is_roi_only(self) -> None:\n        source = Path("neyrobot_prod/selfie_v262_landmark_field_compositor.py").read_text(encoding="utf-8")\n        self.assertIn("def _colour_match_lab_roi", source)\n        self.assertIn("src_roi = warped[y0:y1, x0:x1]", source)\n        self.assertIn("tgt_roi = target[y0:y1, x0:x1]", source)\n        self.assertNotIn("v253._colour_match_lab(corrected, target, anatomy_mask)", source)\n\n    def test_pro_failover_has_one_bounded_attempt(self) -> None:\n        source = Path("neyrobot_prod/selfie_v241_authoritative_runtime.py").read_text(encoding="utf-8")\n        self.assertIn('GEMINI_SELFIE_REQUEST_TIMEOUT_S", "90"', source)\n        self.assertIn("max_attempts = 1", source)\n        self.assertIn("pro_attempts=1", source)\n        self.assertIn("_PRO_CIRCUIT_OPEN_UNTIL = time.monotonic() + 300.0", source)\n\n    def test_http_transport_info_logs_are_suppressed(self) -> None:\n        source = Path("main.py").read_text(encoding="utf-8")\n        self.assertIn('logging.getLogger("httpx").setLevel(logging.WARNING)', source)\n        self.assertIn('logging.getLogger("httpcore").setLevel(logging.WARNING)', source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY
          python -m py_compile neyrobot_prod/selfie_v262_landmark_field_compositor.py neyrobot_prod/selfie_v241_authoritative_runtime.py main.py tests/test_v262_quality_stability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neyrobot_prod/selfie_v262_landmark_field_compositor.py neyrobot_prod/selfie_v241_authoritative_runtime.py main.py tests/test_v262_landmark_field_compositor.py tests/test_v262_quality_stability.py
          git commit -m "fix: keep V262 on large faces and bound selfie failover"
          git push origin HEAD:work/v262-quality-stability-20260831
