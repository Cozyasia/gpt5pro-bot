name: V265 L2 Canonical Bake-off
on:
  pull_request:
    branches: [main]
    paths:
      - 'neyrobot_prod/v265_l2_geometry.py'
      - 'scripts/v265_l2_*.py'
      - 'tests/test_v265_l2_geometry.py'
      - 'tests/test_v265_l2_asset_policy.py'
      - 'tests/fixtures/v265_l2_assets.json'
      - '.github/workflows/v265-l2-bakeoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.1.3 opencv-python-headless==4.10.0.84 pytest==8.3.4
      - run: PYTHONPATH=. pytest -q tests/test_v265_l2_geometry.py tests/test_v265_l2_asset_policy.py
      - name: Assert unattended CI cannot download research assets
        run: |
          if python -m scripts.v265_l2_prepare --output /tmp/v265-l2-assets; then
            echo 'research-only assets bypassed the license gate' >&2
            exit 1
          fi
