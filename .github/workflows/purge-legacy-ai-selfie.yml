name: Purge legacy AI selfie source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/purge_legacy_ai_selfie.py
      - sitecustomize.py
      - .github/workflows/purge-legacy-ai-selfie.yml

permissions:
  contents: write

concurrency:
  group: purge-legacy-ai-selfie-main
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip selfie purge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Back up current main.py
        run: cp main.py main.py.pre-ai-selfie-purge.bak
      - name: Physically purge obsolete AI-selfie source
        run: |
          python tools/purge_legacy_ai_selfie.py main.py
          python -m py_compile main.py tools/purge_legacy_ai_selfie.py
          ! grep -RniE 'aiselfie|ai_selfie|celebrity_selfie|awaiting_ai_selfie|as_preset_|AI-селфи со звездой|AI-селфи со знаменитостью|селфи со звездой|селфи со знаменитостью|cs20[1-9]|cs21[0-9]|cs22[0-9]|cs23[0-9]' --include='*.py' --exclude='purge_legacy_ai_selfie.py' --exclude='main.py.pre-ai-selfie-purge.bak' .
      - name: Commit physically sanitized source
        run: |
          if git diff --quiet -- main.py; then
            echo 'ERROR: purge produced no physical main.py change'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py main.py.pre-ai-selfie-purge.bak
          git commit -m 'Physically remove legacy AI selfie feature from main [skip selfie purge]'
          git push origin HEAD:main
