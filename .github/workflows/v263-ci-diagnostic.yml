name: V263 CI Diagnostic

on:
  push:
    branches: ["work/v263-dense-identity-lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run baseline suite without V263 tests
        shell: bash
        run: |
          set +e
          mapfile -t baseline_files < <(find tests -maxdepth 1 -type f -name 'test_*.py' ! -name 'test_v263_dense_identity_lock.py' | sort)
          PROD_HARDENING_ENABLED=0 python -m unittest -v "${baseline_files[@]}" > "$RUNNER_TEMP/baseline.raw" 2>&1
          code=$?
          set -e
          python - "$RUNNER_TEMP/baseline.raw" "$RUNNER_TEMP/baseline-report.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:]
          text = open(src, encoding='utf-8', errors='replace').read()
          patterns = [
              r'(?i)(authorization\s*[:=]\s*)([^\s]+)',
              r'(?i)((?:token|secret|password|api[_-]?key)\s*[:=]\s*)([^\s]+)',
              r'(?i)(bearer\s+)([A-Za-z0-9._~+/=-]+)',
          ]
          for p in patterns:
              text = re.sub(p, r'\1[REDACTED]', text)
          lines = text.splitlines()
          report = '\n'.join(lines[-160:]) + '\n'
          open(dst, 'w', encoding='utf-8').write(report)
          PY
          {
            echo "### baseline-suite (exit $code)"
            echo '```text'
            cat "$RUNNER_TEMP/baseline-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload sanitized baseline failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-failure-report
          path: ${{ runner.temp }}/baseline-report.txt
          if-no-files-found: ignore

  v263-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run V263 unit tests
        shell: bash
        run: |
          set +e
          PROD_HARDENING_ENABLED=0 python -m unittest discover -s tests -p 'test_v263_dense_identity_lock.py' -v > "$RUNNER_TEMP/v263-unit.raw" 2>&1
          code=$?
          set -e
          python - "$RUNNER_TEMP/v263-unit.raw" "$RUNNER_TEMP/v263-unit-report.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:]
          text = open(src, encoding='utf-8', errors='replace').read()
          patterns = [
              r'(?i)(authorization\s*[:=]\s*)([^\s]+)',
              r'(?i)((?:token|secret|password|api[_-]?key)\s*[:=]\s*)([^\s]+)',
              r'(?i)(bearer\s+)([A-Za-z0-9._~+/=-]+)',
          ]
          for p in patterns:
              text = re.sub(p, r'\1[REDACTED]', text)
          lines = text.splitlines()
          report = '\n'.join(lines[-160:]) + '\n'
          open(dst, 'w', encoding='utf-8').write(report)
          PY
          {
            echo "### v263-unit (exit $code)"
            echo '```text'
            cat "$RUNNER_TEMP/v263-unit-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload sanitized V263 unit failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v263-unit-failure-report
          path: ${{ runner.temp }}/v263-unit-report.txt
          if-no-files-found: ignore

  v263-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download public portrait fixtures
        run: |
          mkdir -p /tmp/v263-fixtures
          base="https://raw.githubusercontent.com/yakhyo/uniface/df87c6531f4d1bdad665882d42d658590e724ea4/assets/source"
          curl -L --fail --retry 3 "$base/verify_now_2024.jpg" -o /tmp/v263-fixtures/verify_now_2024.jpg
          curl -L --fail --retry 3 "$base/verify_curie.jpg" -o /tmp/v263-fixtures/verify_curie.jpg
          curl -L --fail --retry 3 "$base/pose_left.jpg" -o /tmp/v263-fixtures/pose_left.jpg
          curl -L --fail --retry 3 "$base/verify_einstein_1921.jpg" -o /tmp/v263-fixtures/verify_einstein_1921.jpg
      - name: Run V263 identity smoke
        shell: bash
        run: |
          set +e
          PROD_HARDENING_ENABLED=0 python scripts/v263_identity_smoke.py --fixtures /tmp/v263-fixtures --output /tmp/v263-two-person-output.png > "$RUNNER_TEMP/v263-smoke.raw" 2>&1
          code=$?
          set -e
          python - "$RUNNER_TEMP/v263-smoke.raw" "$RUNNER_TEMP/v263-smoke-report.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:]
          text = open(src, encoding='utf-8', errors='replace').read()
          patterns = [
              r'(?i)(authorization\s*[:=]\s*)([^\s]+)',
              r'(?i)((?:token|secret|password|api[_-]?key)\s*[:=]\s*)([^\s]+)',
              r'(?i)(bearer\s+)([A-Za-z0-9._~+/=-]+)',
          ]
          for p in patterns:
              text = re.sub(p, r'\1[REDACTED]', text)
          lines = text.splitlines()
          report = '\n'.join(lines[-160:]) + '\n'
          open(dst, 'w', encoding='utf-8').write(report)
          PY
          {
            echo "### v263-smoke (exit $code)"
            echo '```text'
            cat "$RUNNER_TEMP/v263-smoke-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload sanitized V263 smoke failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v263-smoke-failure-report
          path: ${{ runner.temp }}/v263-smoke-report.txt
          if-no-files-found: ignore
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v263-diagnostic-smoke-output
          path: /tmp/v263-two-person-output.png
          if-no-files-found: ignore
