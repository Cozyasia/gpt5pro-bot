name: NEYRONIX payment currency guards
on:
  push:
    branches: [work/neyronix-migration-20261028]
    paths:
      - 'neyrobot_prod/payments.py'
      - 'tests/test_neyronix_payment_validation.py'
      - '.github/workflows/neyronix-payment-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_neyronix_payment_validation.py' -v
