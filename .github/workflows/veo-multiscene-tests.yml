name: Veo Multi-Scene Tests
on:
  push:
    branches: [feature/veo-multiscene-8-60]
  pull_request:
    paths:
      - 'neyrobot_prod/veo_*.py'
      - 'neyrobot_prod/video_*layout.py'
      - 'tests/test_veo_*.py'
      - 'tests/test_video_overlay_layout.py'
      - 'main.py'
      - '.github/workflows/veo-multiscene-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install httpx
      - name: Compile edited modules
        run: python -m compileall -q main.py neyrobot_prod/veo_multiscene.py neyrobot_prod/veo_scene_prompt.py neyrobot_prod/veo_assembler.py neyrobot_prod/veo_orchestrator.py neyrobot_prod/veo_task_journal.py neyrobot_prod/veo_scene_runner.py neyrobot_prod/veo_scene_artifacts.py neyrobot_prod/veo_resumable_pipeline.py neyrobot_prod/veo_comet_adapter.py
      - name: Run Veo unit tests
        run: python -m unittest discover -s tests -p 'test_veo_*.py' -v
      - name: Run overlay layout tests
        run: python -m unittest discover -s tests -p 'test_video_overlay_layout.py' -v
