name: V265 Commercial L2
on:
  pull_request:
    branches: [main]
    paths:
      - 'neyrobot_prod/v265_commercial_geometry.py'
      - 'neyrobot_prod/v265_vendor_identity.py'
      - 'scripts/v265_commercial_*'
      - 'scripts/v265_prior_toy.py'
      - 'experiments/v265_prior/**'
      - 'tests/test_v265_pilot.py'
      - 'scripts/v265_metahuman_evaluation_access.py'
      - 'tests/test_v265_prior_toy.py'
      - 'tests/test_v265_evaluation_access.py'
      - 'tests/test_v265_commercial_geometry.py'
      - 'tests/test_v265_vendor_identity.py'
      - 'tests/fixtures/v265_commercial_assets.json'
      - 'docs/engineering/v265-commercial-l2/**'
      - '.github/workflows/v265-commercial-l2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==1.26.4 pytest==8.3.4
      - run: PYTHONPATH=. pytest -q tests/test_v265_commercial_geometry.py tests/test_v265_vendor_identity.py
      - name: Internal prior numerical contracts (no pretrained weights)
        env:
          PROD_HARDENING_ENABLED: '0'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest tests.test_v265_prior_toy tests.test_v265_evaluation_access -v
      - name: Toy train and fresh inference on Apache canonical topology
        env:
          PROD_HARDENING_ENABLED: '0'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/google-ai-edge/mediapipe/master/mediapipe/modules/face_geometry/data/canonical_face_model.obj -o /tmp/v265-canonical.obj
          for dim in 128 256; do
            python scripts/v265_prior_toy.py --canonical /tmp/v265-canonical.obj --dim "$dim" --output "/tmp/toy-$dim"
            python scripts/v265_prior_toy.py --infer-checkpoint "/tmp/toy-$dim/toy_checkpoint.npz" --output "/tmp/toy-$dim/inference.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prior-toy-engineering-NOT-identity-qualification
          path: /tmp/toy-*/*.json

  pilot-infrastructure:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PROD_HARDENING_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r experiments/v265_prior/requirements.txt
      - name: Rights, lineage, geometry and training smoke contracts
        run: python -m unittest tests.test_v265_pilot experiments.v265_prior.test_model -v
      - name: Untrained encoder engineering only (no identity qualification)
        run: python -m experiments.v265_prior.benchmark --output /tmp/pilot-encoders
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-encoder-engineering-NOT-identity-quality
          path: /tmp/pilot-encoders/engineering.json
