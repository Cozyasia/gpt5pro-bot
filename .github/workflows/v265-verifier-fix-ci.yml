name: V265 Verifier Fix CI

on:
  pull_request:
    branches: [main]
    paths:
      - "neyrobot_prod/__init__.py"
      - "neyrobot_prod/v265_production_verifier.py"
      - "neyrobot_prod/v265_production_verifier_runtime_ready.py"
      - "tests/test_v265_verifier_readiness.py"
      - ".github/workflows/v265-verifier-fix-ci.yml"
  push:
    branches: [main]
    paths:
      - "neyrobot_prod/__init__.py"
      - "neyrobot_prod/v265_production_verifier.py"
      - "neyrobot_prod/v265_production_verifier_runtime_ready.py"
      - "tests/test_v265_verifier_readiness.py"
      - ".github/workflows/v265-verifier-fix-ci.yml"

permissions:
  contents: read

jobs:
  verifier-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile verifier modules
        run: |
          python -m py_compile neyrobot_prod/v265_production_verifier.py
          python -m py_compile neyrobot_prod/v265_production_verifier_runtime_ready.py
      - name: Run verifier regression
        env:
          PROD_HARDENING_ENABLED: "0"
        run: python -m unittest tests.test_v265_verifier_readiness -v
