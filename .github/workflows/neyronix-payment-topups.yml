name: NEYRONIX idempotent payment topups
on:
  push:
    branches: [work/neyronix-migration-20261028]
    paths:
      - 'neyronix_payment_topups.py'
      - 'tests/test_neyronix_payment_topups.py'
      - '.github/workflows/neyronix-payment-topups.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_neyronix_payment_topups.py' -v
