name: Rollback CI Diagnostic

on:
  push:
    branches: ["work/v263-safe-default-v262"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run production core tests with captured report
        id: tests
        shell: bash
        run: |
          set +e
          PROD_HARDENING_ENABLED=0 python -m unittest discover -s tests -v > rollback-ci-report.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          {
            echo '## Rollback CI diagnostic tail'
            echo '```text'
            tail -n 160 rollback-ci-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: rollback-ci-report
          path: rollback-ci-report.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve original test result
        shell: bash
        run: exit "${{ steps.tests.outputs.exit_code }}"
