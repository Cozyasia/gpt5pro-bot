name: NEYRONIX payment wiring audit
on:
  push:
    branches: [work/neyronix-migration-20261028]
    paths:
      - 'scripts/audit_payment_wiring.py'
      - '.github/workflows/neyronix-payment-wiring-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_payment_wiring.py
