name: V265 formal neutral shell
on:
  push:
    branches: [v265-self-hosted-l2]
    paths: ['experiments/v265_formal_shell/**', '.github/workflows/v265-formal-shell.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
        working-directory: /tmp
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest experiments.v265_formal_shell.test_geometry experiments.v265_retained.test_contract
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_formal_shell.cones /tmp/formal-shell
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_formal_shell.field /tmp/formal-shell
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_formal_shell.preflight /tmp/formal-shell
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_formal_shell.global_field /tmp/formal-shell
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_formal_shell.witness /tmp/formal-shell
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_formal_shell.admission /tmp/formal-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-shell-neutral-evidence-NOT-PRODUCTION
          path: /tmp/formal-shell
