name: Singing clip checks
on:
  pull_request:
    paths:
      - 'neyrobot_prod/singing_clip_*.py'
      - 'main.py'
      - 'video_studio.py'
      - 'tests/test_singing_clip_pipeline.py'
      - 'tests/test_seedance_resumable_transport.py'
      - 'tests/test_vocal_clip_staging.py'
      - 'tests/test_vocal_song_recovery.py'
      - 'tests/test_vocal_clip_custom_audio_flow.py'
      - 'tests/test_vocal_clip_seedance_kling_contract.py'
      - 'tests/test_provider_input_artifacts.py'
      - 'tests/test_kling_photo_clip_image_reference.py'
      - '.github/workflows/singing-clip-checks.yml'
  push:
    branches:
      - feature/suno-seedance-singing-clip
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      PROD_HARDENING_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated transport dependency
        run: python -m pip install --disable-pip-version-check 'httpx>=0.27,<1'
      - name: Compile singing-clip implementation
        run: python -m py_compile main.py video_studio.py neyrobot_prod/singing_clip_pipeline.py neyrobot_prod/singing_clip_assembly.py neyrobot_prod/singing_clip_audio.py neyrobot_prod/singing_clip_seedance_reference.py
      - name: Run offline singing-clip tests
        run: python -m unittest tests.test_singing_clip_pipeline tests.test_seedance_resumable_transport tests.test_vocal_clip_staging tests.test_music_video_audio_review_pending tests.test_vocal_song_recovery tests.test_vocal_clip_custom_audio_flow tests.test_vocal_clip_seedance_kling_contract tests.test_provider_input_artifacts tests.test_kling_photo_clip_image_reference -v
