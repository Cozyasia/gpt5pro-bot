name: V264 CI Decomposition

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-file-matrix:
    name: Baseline ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test_celebrity_selfie.py
          - test_celebrity_selfie_v203.py
          - test_celebrity_selfie_v204.py
          - test_commercial_numbers_v201.py
          - test_credit_selfie_v201.py
          - test_medical_v119_activation.py
          - test_openai_httpx_compat.py
          - test_prod_core.py
          - test_retouch_v261_batch.py
          - test_selfie_admin_v202.py
          - test_selfie_commands_v206.py
          - test_selfie_runtime_v207.py
          - test_selfie_storage_v205.py
          - test_selfie_v208_overlay.py
          - test_selfie_v209_canonical.py
          - test_selfie_v210_generation_guard.py
          - test_selfie_v211_delivery.py
          - test_selfie_v213_user_identity_lock.py
          - test_selfie_v214_reuse_controls.py
          - test_selfie_v215_shot_scene_modes.py
          - test_selfie_v216_admin_upload_priority.py
          - test_v249_startup_bootstrap.py
          - test_v250_hyperswap_identity.py
          - test_v251_v2_identity_detail.py
          - test_v252_v3_png_quality.py
          - test_v253_yunet_source_pixels.py
          - test_v254_landmark_fit_seamless_source.py
          - test_v255_source_face_gate.py
          - test_v256_large_scale_source_pixels.py
          - test_v257_native_sampling_guard.py
          - test_v258_inner_face_integration.py
          - test_v259_eye_landmark_protection.py
          - test_v260_eye_roi_memory_safe.py
          - test_v261_edge_harmonization.py
          - test_v262_landmark_field_compositor.py
          - test_v262_quality_stability.py
          - test_version_active_selfie_runtime.py
          - test_version_owner.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Run isolated test file with pytest
        env:
          PROD_HARDENING_ENABLED: "0"
        run: python -m pytest -q "tests/${{ matrix.file }}"

  v264-unit-regression:
    name: V264 68 unit regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PROD_HARDENING_ENABLED: "0"
        run: python -m unittest discover -s tests -p 'test_v263_dense_identity_lock.py' -v

  startup-import:
    name: Startup import only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PROD_HARDENING_ENABLED: "0"
        run: python -c "import neyrobot_prod; print(neyrobot_prod.VERSION)"

  real-model-smoke:
    name: Real-model dense68 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download public fixtures
        run: |
          mkdir -p /tmp/v264-fixtures
          base="https://raw.githubusercontent.com/yakhyo/uniface/df87c6531f4d1bdad665882d42d658590e724ea4/assets/source"
          curl -L --fail --retry 3 "$base/verify_now_2024.jpg" -o /tmp/v264-fixtures/verify_now_2024.jpg
          curl -L --fail --retry 3 "$base/verify_curie.jpg" -o /tmp/v264-fixtures/verify_curie.jpg
          curl -L --fail --retry 3 "$base/pose_left.jpg" -o /tmp/v264-fixtures/pose_left.jpg
          curl -L --fail --retry 3 "$base/verify_einstein_1921.jpg" -o /tmp/v264-fixtures/verify_einstein_1921.jpg
      - name: Run real-model matrix
        env:
          PROD_HARDENING_ENABLED: "0"
        run: python scripts/v263_identity_smoke.py --fixtures /tmp/v264-fixtures --output /tmp/v264-two-person-output.png
