name: V265 Production CI Decomposition

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  enumerate-tests:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        name: Enumerate production unittest files
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          files = sorted(glob.glob('tests/test_*.py'))
          print('files=' + json.dumps(files, separators=(',', ':')))
          PY

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .

  test-file:
    needs: enumerate-tests
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        file: ${{ fromJSON(needs.enumerate-tests.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run exact Production-CI discovery semantics for one file
        env:
          PROD_HARDENING_ENABLED: "0"
        shell: bash
        run: |
          pattern="$(basename '${{ matrix.file }}')"
          python -m unittest discover -s tests -p "$pattern" -v
