name: V265 first-principles mouth
on:
  push:
    branches: [v265-self-hosted-l2]
    paths: ['experiments/v265_mouth/**', '.github/workflows/v265-mouth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mouth-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
        working-directory: /tmp
      - run: python -m unittest experiments.v265_mouth.test_component -v
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_mouth.run /tmp/mouth
      - name: Verify fail-closed sequencing
        run: |
          python -c "import json; d=json.load(open('/tmp/mouth/summary.json')); assert d['neutral_pass']; assert d['jaw_contact_pass']; assert not d['jaw_pass']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-principles-mouth
          path: /tmp/mouth
