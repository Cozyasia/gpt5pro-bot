name: NEYRONIX secure payment integration
on:
  push:
    branches: [work/neyronix-migration-20261028]
    paths:
      - 'main.py'
      - 'tests/test_neyronix_secure_payment_registration.py'
      - '.github/workflows/neyronix-secure-payment-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py neyrobot_prod/payments.py
      - run: python -m unittest discover -s tests -p 'test_neyronix_secure_payment_registration.py' -v
      - run: python -m unittest discover -s tests -p 'test_neyronix_payment_identity.py' -v
      - run: python -m unittest discover -s tests -p 'test_neyronix_payment_runtime_contract.py' -v
