name: Property video offline checks

on:
  pull_request:
    paths:
      - 'real_estate_*.py'
      - 'property_video_*.py'
      - 'tests/test_real_estate*.py'
      - 'tests/test_property_video*.py'
      - 'sitecustomize.py'
      - '.github/workflows/property-video-checks.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_HARDENING_ENABLED: '0'
      REAL_ESTATE_VIDEO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Telegram SDK
        run: python -m pip install 'python-telegram-bot>=21,<23'
      - name: Compile property modules
        run: python -m py_compile real_estate_video.py real_estate_safe_router.py real_estate_bootstrap.py real_estate_pipeline.py real_estate_veo_adapter.py property_video_billing.py property_video_pipeline.py property_video_execution.py property_video_director.py
      - name: Run property wizard tests
        run: python -m unittest discover -s tests -p 'test_real_estate*.py' -v
      - name: Run property pipeline and billing tests
        run: python -m unittest tests.test_property_video_pipeline tests.test_property_video_billing tests.test_property_video_director -v
