name: Telegram local Docker build check
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - Dockerfile.telegram-local
      - ops/start_telegram_local.sh
      - .github/workflows/telegram-local-docker-build.yml
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build local Telegram API image without deploying
        run: docker build --progress=plain -f Dockerfile -t telegram-local-build-check .
      - name: Check entrypoint and Bot API binary
        run: |
          docker run --rm --entrypoint /bin/sh telegram-local-build-check -c 'test -x /usr/local/bin/telegram-bot-api && test -x /app/ops/start_telegram_local.sh && python -c "import telegram; print(telegram.__version__)"'
