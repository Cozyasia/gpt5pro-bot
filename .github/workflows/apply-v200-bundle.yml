name: Apply v200 bundle
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Rebuild clean Celebrity Selfie module
        run: |
          cat .deploy/v200/exact_00.b64 .deploy/v200/exact_01.b64 .deploy/v200/exact_02.b64 .deploy/v200/exact_03.b64 .deploy/v200/exact_04.b64 .deploy/v200/exact_05.b64 .deploy/v200/exact_06.b64 .deploy/v200/exact_07.b64 .deploy/v200/exact_08.b64 .deploy/v200/exact_09.b64 > /tmp/celebrity_selfie_mode.py.gz.b64
          base64 --decode /tmp/celebrity_selfie_mode.py.gz.b64 | gzip --decompress > celebrity_selfie_mode.py
      - name: Apply integration files
        run: |
          patch -p4 < .deploy/v200/main_changes.patch
          patch -p4 < .deploy/v200/render_changes.patch
          cp .deploy/v200/files/sitecustomize.py sitecustomize.py
          cp .deploy/v200/files/neyrobot_prod/__init__.py neyrobot_prod/__init__.py
          cp .deploy/v200/files/neyrobot_prod/versioning.py neyrobot_prod/versioning.py
          cp .deploy/v200/files/tests/run_production_suite.py tests/run_production_suite.py
          cp .deploy/v200/files/tests/test_celebrity_selfie_clean.py tests/test_celebrity_selfie_clean.py
          mkdir -p assets/celebrities_seed/roman_abramovich
          cp .deploy/v200/files/assets/celebrities_seed/catalog.json assets/celebrities_seed/catalog.json
      - name: Seed Roman Abramovich reference pack
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, re
          root = pathlib.Path('.')
          source = root / 'celebrity_library' / 'fixed_refs' / 'ru_roman_abramovich'
          target = root / 'assets' / 'celebrities_seed' / 'roman_abramovich'
          catalog_path = root / 'assets' / 'celebrities_seed' / 'catalog.json'
          names = ['01_front_current.jpg.b64', '02_three_quarter_current.jpg.b64', '03_front_warm_current.jpg.b64']
          def decode_asset(path):
              text = path.read_text(encoding='ascii')
              runs = re.findall(r'[A-Za-z0-9+/=]{32,}', text)
              for value in [''.join(runs), *runs]:
                  if not value:
                      continue
                  variants = [value]
                  pad_at = value.find('=')
                  if pad_at >= 0:
                      end = pad_at + 1
                      while end < len(value) and value[end] == '=':
                          end += 1
                      variants.insert(0, value[:end])
                  for candidate in variants:
                      payload = candidate
                      if '=' not in payload and len(payload) % 4:
                          payload += '=' * (-len(payload) % 4)
                      try:
                          raw = base64.b64decode(payload, validate=True)
                      except Exception:
                          continue
                      if len(raw) >= 4000 and raw.startswith(b'\xff\xd8\xff') and raw.endswith(b'\xff\xd9'):
                          return raw
              raise RuntimeError(f'No complete JPEG in {path}')
          data = json.loads(catalog_path.read_text(encoding='utf-8'))
          refs = data['characters']['roman_abramovich']['refs']
          for idx, src_name in enumerate(names, 1):
              raw = decode_asset(source / src_name)
              dest = target / f'ref_{idx:02d}.jpg'
              dest.write_bytes(raw)
              refs[idx - 1]['filename'] = dest.name
              refs[idx - 1]['sha256'] = hashlib.sha256(raw).hexdigest()
          catalog_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate final source
        run: |
          python -m compileall -q main.py celebrity_selfie_mode.py neyrobot_prod tests
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('celebrity_selfie_mode.py')
          assert p.stat().st_size == 59435, p.stat().st_size
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '5b73c8a676d082570cbe2efa6384296a0ab0427a076fff9d30aff5c39e7f8f2a'
          assert 'group=-200' in pathlib.Path('main.py').read_text(encoding='utf-8')
          assert 'CELEBRITY_SELFIE_MIN_USER_SIMILARITY' in pathlib.Path('render.yaml').read_text(encoding='utf-8')
          PY
      - name: Commit final source and remove bootstrap
        run: |
          rm -rf .deploy/v200
          rm -f .github/workflows/apply-v200-bundle.yml
          rm -f DEPLOY_V200_TRIGGER.txt FINALIZE_V200.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Deploy clean v200 Celebrity Selfie rewrite"
          git push origin HEAD:${{ github.head_ref }}
