name: NEYRONIX credit marker restart
on:
  push:
    branches: [work/neyronix-migration-20261028]
    paths:
      - 'secret_loader.py'
      - 'tests/test_neyronix_wallet_migration_readiness.py'
      - '.github/workflows/neyronix-credit-marker-restart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_neyronix_wallet_migration_readiness.py' -v
