name: V265 eyelid closure admission
on:
  push:
    branches: [v265-self-hosted-l2]
    paths: ['experiments/v265_eyelid/**', '.github/workflows/v265-eyelid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eyelid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
        working-directory: /tmp
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest experiments.v265_eyelid.test_closure experiments.v265_retained.test_contract experiments.v265_commissure.test_candidates
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_eyelid.root /tmp/eyelid
      - run: OPENBLAS_NUM_THREADS=1 python -m experiments.v265_eyelid.audit /tmp/eyelid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eyelid-closure-NOT-ADMITTED
          path: /tmp/eyelid
