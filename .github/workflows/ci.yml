name: Production CI

on:
  push:
    branches: [main, "prod/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Install FFmpeg for media integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run production core tests
        env:
          PROD_HARDENING_ENABLED: "0"
        run: python -m unittest discover -s tests -v
